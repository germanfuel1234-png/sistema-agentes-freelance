services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      # Solo localhost a proposito: en esta etapa (local) no hace falta
      # exponerlo a la LAN. Cuando se arme el tunel de Cloudflare, este
      # apunta a localhost:5678 igual, no hace falta cambiar esto.
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # Contenedor aparte con Python/Node/Chromium/Playwright, para todo lo
  # que la imagen oficial de n8n (hardened, sin gestor de paquetes) no
  # puede correr. No se publica ningún puerto a la LAN ni a internet -
  # solo n8n le habla por HTTP dentro de la red interna de Compose
  # (http://runner:8000), nunca con Execute Command ni SSH.
  runner:
    build:
      context: ..
      dockerfile: n8n/runner/Dockerfile
    image: sistema-agentes-runner:latest
    restart: unless-stopped
    volumes:
      - ..:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Los 4 scripts de loop, containerizados para el despliegue en
  # servidor (antes corrian sueltos en la PC via terminal). Reusan la
  # MISMA imagen que runner (mismo Dockerfile: Python+Playwright+Chromium
  # ya instalados) - no hace falta buildear una imagen nueva por cada
  # uno, solo cambia el `command`. restart:unless-stopped porque el
  # sentido de mudarse al servidor es que corran solos, sin depender de
  # que la PC de casa este prendida.
  loop_caza:
    image: sistema-agentes-runner:latest
    restart: unless-stopped
    working_dir: /data
    command: ["python3", "/data/loop_caza.py"]
    volumes:
      - ..:/data
    depends_on:
      - runner

  send_loop:
    image: sistema-agentes-runner:latest
    restart: unless-stopped
    working_dir: /data
    command: ["python3", "/data/send_loop.py"]
    volumes:
      - ..:/data
    depends_on:
      - runner

  postular_formularios:
    image: sistema-agentes-runner:latest
    restart: unless-stopped
    working_dir: /data
    command: ["python3", "/data/postular_formularios.py", "--intervalo", "5"]
    volumes:
      - ..:/data
    depends_on:
      - runner

  # Requiere que linkedin_session.json ya exista en /data (correr
  # linkedin_login_setup.py A MANO primero - necesita ventana grafica,
  # no se puede hacer dentro de este contenedor headless). Si el archivo
  # todavia no esta, el script no rompe: loguea el error en cada ciclo y
  # sigue esperando, sin crashear el contenedor.
  buscar_postulaciones_linkedin:
    image: sistema-agentes-runner:latest
    restart: unless-stopped
    working_dir: /data
    command: ["python3", "/data/buscar_postulaciones_linkedin.py", "--intervalo", "60"]
    volumes:
      - ..:/data
    depends_on:
      - runner

  # Dashboard chico para cargar datos de un cliente y disparar el
  # generador de presupuesto (le pega al runner por la red interna).
  # Publicado solo en 127.0.0.1, igual que n8n - no expuesto a la LAN.
  dashboard:
    build:
      context: ..
      dockerfile: n8n/dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ../presupuestos_generados:/data/presupuestos_generados
    depends_on:
      - runner

volumes:
  postgres_data:
  n8n_data:
